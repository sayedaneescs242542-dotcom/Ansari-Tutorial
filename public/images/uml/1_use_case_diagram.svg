<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950">
  <defs>
    <linearGradient id="bgUml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>
    <linearGradient id="topNavUml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b224d" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="ucGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <linearGradient id="ucGradInc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.09" />
    </filter>
    <marker id="ucArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="extendArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="950" fill="url(#bgUml)" />

  <!-- Title Banner -->
  <rect x="40" y="25" width="1320" height="80" rx="14" fill="url(#topNavUml)" filter="url(#boxShadow)" />
  <text x="70" y="60" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="22" fill="#ffffff">
    SYSTEM MODELING: USE CASE DIAGRAM
  </text>
  <text x="70" y="85" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="13" fill="#93c5fd">
    Application: Ansari Tutorial Academic Web Platform | Core Actors: Visitor, Enrolled Student &amp; Super Admin
  </text>
  <rect x="1140" y="45" width="190" height="38" rx="19" fill="#f59e0b" />
  <text x="1235" y="69" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#0b224d">
    UML SPECIFICATION
  </text>

  <!-- System Boundary Box -->
  <rect x="290" y="130" width="820" height="770" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="10 6" filter="url(#boxShadow)" />
  <rect x="310" y="145" width="360" height="32" rx="8" fill="#e0f2fe" />
  <text x="325" y="166" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#0369a1">
    «system boundary» Ansari Tutorial Web Platform
  </text>

  <!-- ==================== ACTOR 1: VISITOR / PROSPECTIVE STUDENT (Left Top) ==================== -->
  <g transform="translate(100, 200)">
    <!-- Actor Head -->
    <circle cx="50" cy="30" r="18" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.5" />
    <!-- Body -->
    <line x1="50" y1="48" x2="50" y2="95" stroke="#1e3a8a" stroke-width="2.5" />
    <!-- Arms -->
    <line x1="15" y1="65" x2="85" y2="65" stroke="#1e3a8a" stroke-width="2.5" />
    <!-- Legs -->
    <line x1="50" y1="95" x2="25" y2="140" stroke="#1e3a8a" stroke-width="2.5" />
    <line x1="50" y1="95" x2="75" y2="140" stroke="#1e3a8a" stroke-width="2.5" />
    <!-- Label -->
    <text x="50" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#0b224d">
      Visitor / Applicant
    </text>
    <text x="50" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      (Prospective Student)
    </text>
  </g>

  <!-- ==================== ACTOR 2: ENROLLED STUDENT (Left Bottom) ==================== -->
  <g transform="translate(100, 580)">
    <!-- Actor Head -->
    <circle cx="50" cy="30" r="18" fill="#ffffff" stroke="#059669" stroke-width="2.5" />
    <!-- Body -->
    <line x1="50" y1="48" x2="50" y2="95" stroke="#059669" stroke-width="2.5" />
    <!-- Arms -->
    <line x1="15" y1="65" x2="85" y2="65" stroke="#059669" stroke-width="2.5" />
    <!-- Legs -->
    <line x1="50" y1="95" x2="25" y2="140" stroke="#059669" stroke-width="2.5" />
    <line x1="50" y1="95" x2="75" y2="140" stroke="#059669" stroke-width="2.5" />
    <!-- Label -->
    <text x="50" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#065f46">
      Enrolled Student
    </text>
    <text x="50" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      (Registered Pupil)
    </text>
  </g>

  <!-- ==================== ACTOR 3: SUPER ADMIN (Right Middle) ==================== -->
  <g transform="translate(1220, 360)">
    <!-- Actor Head -->
    <circle cx="50" cy="30" r="18" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5" />
    <!-- Body -->
    <line x1="50" y1="48" x2="50" y2="95" stroke="#b91c1c" stroke-width="2.5" />
    <!-- Arms -->
    <line x1="15" y1="65" x2="85" y2="65" stroke="#b91c1c" stroke-width="2.5" />
    <!-- Legs -->
    <line x1="50" y1="95" x2="25" y2="140" stroke="#b91c1c" stroke-width="2.5" />
    <line x1="50" y1="95" x2="75" y2="140" stroke="#b91c1c" stroke-width="2.5" />
    <!-- Label -->
    <text x="50" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#991b1b">
      Super Admin
    </text>
    <text x="50" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      Sir Faisal Ansari
    </text>
    <text x="50" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">
      (Graduate in English)
    </text>
  </g>

  <!-- ==================== USE CASES (ELLIPSES) ==================== -->

  <!-- UC1: Browse Courses & 2019 Center Info -->
  <g id="uc1">
    <ellipse cx="490" cy="210" rx="140" ry="28" fill="url(#ucGrad)" stroke="#0284c7" stroke-width="2" filter="url(#boxShadow)" />
    <text x="490" y="215" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#0f172a">
      Browse Courses &amp; 2019 Profile
    </text>
  </g>

  <!-- UC2: View / Download Official Brochure -->
  <g id="uc2">
    <ellipse cx="490" cy="285" rx="140" ry="28" fill="url(#ucGrad)" stroke="#0284c7" stroke-width="2" filter="url(#boxShadow)" />
    <text x="490" y="290" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#0f172a">
      View / Preview Brochure Modal
    </text>
  </g>

  <!-- UC3: Submit Online Admission Application -->
  <g id="uc3">
    <ellipse cx="490" cy="365" rx="145" ry="30" fill="url(#ucGrad)" stroke="#0284c7" stroke-width="2.2" filter="url(#boxShadow)" />
    <text x="490" y="370" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12.5" fill="#0f172a">
      Submit Admission Application
    </text>
  </g>

  <!-- UC-Inc1: Validate Student Application (Included by UC3) -->
  <g id="uc_inc1">
    <ellipse cx="850" cy="365" rx="135" ry="28" fill="url(#ucGradInc)" stroke="#d97706" stroke-width="2" filter="url(#boxShadow)" />
    <text x="850" y="370" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11.5" fill="#854d0e">
      «include» Validate Form Input
    </text>
  </g>

  <!-- UC4: Connect via WhatsApp Helpline -->
  <g id="uc4">
    <ellipse cx="490" cy="445" rx="140" ry="28" fill="url(#ucGrad)" stroke="#0284c7" stroke-width="2" filter="url(#boxShadow)" />
    <text x="490" y="450" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#0f172a">
      Connect on WhatsApp (7666875408)
    </text>
  </g>

  <!-- UC5: Student Registration & Login -->
  <g id="uc5">
    <ellipse cx="490" cy="550" rx="140" ry="28" fill="url(#ucGrad)" stroke="#059669" stroke-width="2" filter="url(#boxShadow)" />
    <text x="490" y="555" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#065f46">
      Student Login &amp; Portal Auth
    </text>
  </g>

  <!-- UC-Inc2: Session Verification (Included by UC5 & UC8) -->
  <g id="uc_inc2">
    <ellipse cx="850" cy="550" rx="135" ry="28" fill="url(#ucGradInc)" stroke="#d97706" stroke-width="2" filter="url(#boxShadow)" />
    <text x="850" y="555" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11.5" fill="#854d0e">
      «include» Verify Session &amp; Guard
    </text>
  </g>

  <!-- UC6: View Announcements & Notices -->
  <g id="uc6">
    <ellipse cx="490" cy="630" rx="140" ry="28" fill="url(#ucGrad)" stroke="#059669" stroke-width="2" filter="url(#boxShadow)" />
    <text x="490" y="635" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#065f46">
      View Notices &amp; Exam Schedule
    </text>
  </g>

  <!-- UC7: Slow Learners Personalized Query (Extend) -->
  <g id="uc7">
    <ellipse cx="490" cy="710" rx="145" ry="28" fill="url(#ucGrad)" stroke="#059669" stroke-width="2" filter="url(#boxShadow)" />
    <text x="490" y="715" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#065f46">
      Request Slow Learner Doubt Help
    </text>
  </g>

  <!-- UC8: Super Admin Authentication -->
  <g id="uc8">
    <ellipse cx="870" cy="460" rx="135" ry="28" fill="url(#ucGrad)" stroke="#b91c1c" stroke-width="2" filter="url(#boxShadow)" />
    <text x="870" y="465" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#991b1b">
      Super Admin Login
    </text>
  </g>

  <!-- UC9: Manage Courses (CRUD) -->
  <g id="uc9">
    <ellipse cx="870" cy="635" rx="135" ry="28" fill="url(#ucGrad)" stroke="#b91c1c" stroke-width="2" filter="url(#boxShadow)" />
    <text x="870" y="640" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#991b1b">
      Manage Courses (5 Streams)
    </text>
  </g>

  <!-- UC10: Process Admission Leads & Enquiries -->
  <g id="uc10">
    <ellipse cx="870" cy="715" rx="135" ry="28" fill="url(#ucGrad)" stroke="#b91c1c" stroke-width="2" filter="url(#boxShadow)" />
    <text x="870" y="720" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#991b1b">
      Review Admission Applications
    </text>
  </g>

  <!-- UC11: Manage Notices & Announcements -->
  <g id="uc11">
    <ellipse cx="870" cy="795" rx="135" ry="28" fill="url(#ucGrad)" stroke="#b91c1c" stroke-width="2" filter="url(#boxShadow)" />
    <text x="870" y="800" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#991b1b">
      Publish Notices &amp; Exam Alerts
    </text>
  </g>

  <!-- UC12: Resilient DB Sync & Seed Trigger -->
  <g id="uc12">
    <ellipse cx="870" cy="240" rx="135" ry="28" fill="url(#ucGradInc)" stroke="#d97706" stroke-width="2" filter="url(#boxShadow)" />
    <text x="870" y="245" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11.5" fill="#854d0e">
      «system» Sync Atlas / Fallback Data
    </text>
  </g>

  <!-- ==================== ASSOCIATIONS & CONNECTORS ==================== -->

  <!-- Visitor to UC1, UC2, UC3, UC4 -->
  <line x1="175" y1="260" x2="350" y2="215" stroke="#1e3a8a" stroke-width="1.8" />
  <line x1="175" y1="265" x2="350" y2="285" stroke="#1e3a8a" stroke-width="1.8" />
  <line x1="175" y1="275" x2="345" y2="365" stroke="#1e3a8a" stroke-width="1.8" />
  <line x1="175" y1="285" x2="350" y2="440" stroke="#1e3a8a" stroke-width="1.8" />

  <!-- Student to UC5, UC6, UC7 -->
  <line x1="175" y1="640" x2="350" y2="555" stroke="#059669" stroke-width="1.8" />
  <line x1="175" y1="655" x2="350" y2="630" stroke="#059669" stroke-width="1.8" />
  <line x1="175" y1="670" x2="345" y2="710" stroke="#059669" stroke-width="1.8" />

  <!-- Super Admin to UC8, UC9, UC10, UC11, UC12 -->
  <line x1="1220" y1="420" x2="1005" y2="460" stroke="#b91c1c" stroke-width="1.8" />
  <line x1="1220" y1="435" x2="1005" y2="635" stroke="#b91c1c" stroke-width="1.8" />
  <line x1="1220" y1="450" x2="1005" y2="715" stroke="#b91c1c" stroke-width="1.8" />
  <line x1="1220" y1="465" x2="1005" y2="795" stroke="#b91c1c" stroke-width="1.8" />
  <line x1="1220" y1="400" x2="1005" y2="245" stroke="#d97706" stroke-width="1.8" />

  <!-- <<include>> relationships (Dashed lines with arrows) -->
  <!-- UC3 includes UC-Inc1 -->
  <path d="M 635 365 L 715 365" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ucArrow)" />
  <text x="675" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">«include»</text>

  <!-- UC5 includes UC-Inc2 -->
  <path d="M 630 550 L 715 550" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ucArrow)" />
  <text x="675" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">«include»</text>

  <!-- UC8 includes UC-Inc2 -->
  <path d="M 870" y1="488" d="M 870 488 L 860 522" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ucArrow)" />
  <text x="895" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">«include»</text>

  <!-- Bottom Legend -->
  <g transform="translate(40, 915)">
    <rect x="0" y="0" width="1320" height="26" rx="6" fill="#f1f5f9" />
    <text x="20" y="17" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">
      LEGEND:
    </text>
    <line x1="85" y1="13" x2="135" y2="13" stroke="#1e3a8a" stroke-width="2" />
    <text x="145" y="17" font-family="Arial, sans-serif" font-size="11" fill="#475569">Association</text>

    <line x1="230" y1="13" x2="280" y2="13" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ucArrow)" />
    <text x="290" y="17" font-family="Arial, sans-serif" font-size="11" fill="#475569">«include» Dependency</text>

    <ellipse cx="445" cy="13" rx="12" ry="7" fill="url(#ucGrad)" stroke="#0284c7" />
    <text x="465" y="17" font-family="Arial, sans-serif" font-size="11" fill="#475569">Standard Use Case</text>

    <ellipse cx="610" cy="13" rx="12" ry="7" fill="url(#ucGradInc)" stroke="#d97706" />
    <text x="630" y="17" font-family="Arial, sans-serif" font-size="11" fill="#475569">Included / Auxiliary System Process</text>
  </g>
</svg>
