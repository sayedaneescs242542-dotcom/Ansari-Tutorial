<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="bgDep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>
    <linearGradient id="topNavDep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b224d" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="depShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="depArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a8a" />
    </marker>
  </defs>

  <rect width="1500" height="1000" fill="url(#bgDep)" />

  <!-- Top Title Banner -->
  <rect x="40" y="25" width="1420" height="80" rx="14" fill="url(#topNavDep)" filter="url(#depShadow)" />
  <text x="70" y="60" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="22" fill="#ffffff">
    SYSTEM MODELING: UML DEPLOYMENT DIAGRAM
  </text>
  <text x="70" y="85" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="13" fill="#93c5fd">
    Physical Infrastructure &amp; Runtime Architecture | 3-Tier Client-Server-Cloud Topology | Ansari Tutorial
  </text>
  <rect x="1220" y="45" width="210" height="38" rx="19" fill="#f59e0b" />
  <text x="1325" y="69" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#0b224d">
    INFRASTRUCTURE TOPOLOGY
  </text>

  <!-- ==================== NODE 1: CLIENT TIER (Left) ==================== -->
  <g transform="translate(60, 150)" filter="url(#depShadow)">
    <!-- 3D Cube Node -->
    <!-- Top Face -->
    <polygon points="0,20 20,0 400,0 380,20" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="380,20 400,0 400,680 380,700" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5" />
    <!-- Front Face -->
    <rect x="0" y="20" width="380" height="680" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" />

    <!-- Node Header -->
    <rect x="0" y="20" width="380" height="48" rx="6" fill="#1e3a8a" />
    <text x="190" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff">
      «device» Client Workstation / Smartphone
    </text>
    <text x="190" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd">
      Browser Environment (Desktop &amp; Mobile)
    </text>

    <!-- Execution Environment: Web Browser -->
    <g transform="translate(18, 90)">
      <rect x="0" y="0" width="344" height="580" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4" stroke-width="1.8" />
      <text x="172" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12.5" fill="#0f172a">
        «execution environment»
      </text>
      <text x="172" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
        Chrome / Edge / Safari / Firefox
      </text>

      <!-- Artifact 1: HTML5 & EJS DOM -->
      <g transform="translate(14, 60)">
        <rect x="0" y="0" width="316" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
        <rect x="10" y="10" width="16" height="12" fill="#3b82f6" />
        <text x="35" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#1e3a8a">«artifact» HTML5 &amp; EJS DOM</text>
        <text x="15" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Rendered pages: Home, About Us,</text>
        <text x="15" y="58" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Courses Catalog, Admission Form, 404</text>
      </g>

      <!-- Artifact 2: Bootstrap 5 & Custom CSS -->
      <g transform="translate(14, 145)">
        <rect x="0" y="0" width="316" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
        <rect x="10" y="10" width="16" height="12" fill="#7c3aed" />
        <text x="35" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#6d28d9">«artifact» Bootstrap 5 &amp; CSS3</text>
        <text x="15" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Mobile responsive grid, academic</text>
        <text x="15" y="58" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">palette (#0b224d, #1d4ed8, #f59e0b)</text>
      </g>

      <!-- Artifact 3: Client JavaScript -->
      <g transform="translate(14, 230)">
        <rect x="0" y="0" width="316" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
        <rect x="10" y="10" width="16" height="12" fill="#f59e0b" />
        <text x="35" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#b45309">«artifact» main.js (Client Controller)</text>
        <text x="15" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Course category dynamic filtering,</text>
        <text x="15" y="58" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">table search &amp; client-side form sanity</text>
      </g>

      <!-- Artifact 4: WhatsApp & Brochure Utilities -->
      <g transform="translate(14, 315)">
        <rect x="0" y="0" width="316" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
        <rect x="10" y="10" width="16" height="12" fill="#10b981" />
        <text x="35" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#047857">«artifact» Floating Interaction Tools</text>
        <text x="15" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Direct WhatsApp widget (wa.me/917666...)</text>
        <text x="15" y="58" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">and Center Pamphlet Preview Modal</text>
      </g>

      <!-- Artifact 5: Session Storage & Cookies -->
      <g transform="translate(14, 400)">
        <rect x="0" y="0" width="316" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
        <rect x="10" y="10" width="16" height="12" fill="#ec4899" />
        <text x="35" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#be185d">«artifact» Cookies / Session State</text>
        <text x="15" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">connect.sid (Signed session cookie)</text>
        <text x="15" y="58" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Student &amp; Super Admin active credentials</text>
      </g>
    </g>
  </g>

  <!-- ==================== NODE 2: APPLICATION SERVER (Center) ==================== -->
  <g transform="translate(540, 150)" filter="url(#depShadow)">
    <polygon points="0,20 20,0 440,0 420,20" fill="#a7f3d0" stroke="#059669" stroke-width="1.5" />
    <polygon points="420,20 440,0 440,680 420,700" fill="#6ee7b7" stroke="#059669" stroke-width="1.5" />
    <rect x="0" y="20" width="420" height="680" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2" />

    <rect x="0" y="20" width="420" height="48" rx="6" fill="#047857" />
    <text x="210" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff">
      «device» Application Server (Port 3000)
    </text>
    <text x="210" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a7f3d0">
      Windows 11 / Linux Node Host Environment
    </text>

    <!-- Execution Environment: Node.js Runtime -->
    <g transform="translate(18, 90)">
      <rect x="0" y="0" width="384" height="580" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4" stroke-width="1.8" />
      <text x="192" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12.5" fill="#0f172a">
        «execution environment» Node.js v24.19.0 Runtime
      </text>
      <text x="192" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
        V8 Engine &amp; Non-Blocking Event Loop
      </text>

      <!-- Component 1: Express.js Framework -->
      <g transform="translate(14, 60)">
        <rect x="0" y="0" width="356" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
        <text x="15" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#047857">«component» Express Framework (app.js)</text>
        <text x="15" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Modular Routing: index, courses, admission,</text>
        <text x="15" y="58" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">contact, notices, student, admin, auth</text>
      </g>

      <!-- Component 2: EJS Template Engine -->
      <g transform="translate(14, 145)">
        <rect x="0" y="0" width="356" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
        <text x="15" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#047857">«component» EJS View Engine</text>
        <text x="15" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Server-side template compilation with view</text>
        <text x="15" y="58" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">cache enabled for sub-100ms response</text>
      </g>

      <!-- Component 3: Resilient Fallback Engine -->
      <g transform="translate(14, 230)">
        <rect x="0" y="0" width="356" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
        <text x="15" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#b45309">«component» Resilient Fallback (defaultData.js)</text>
        <text x="15" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Zero-downtime offline catalog &amp; mock store;</text>
        <text x="15" y="58" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">guarantees 100% route uptime during whitelist</text>
      </g>

      <!-- Component 4: Mongoose ODM -->
      <g transform="translate(14, 315)">
        <rect x="0" y="0" width="356" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
        <text x="15" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#047857">«component» Mongoose ODM 9.9.1</text>
        <text x="15" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Schema validation, connection pooling,</text>
        <text x="15" y="58" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Google DNS [8.8.8.8] &amp; autoSelectFamily: false</text>
      </g>

      <!-- Component 5: Auto-Reconnect Daemon -->
      <g transform="translate(14, 400)">
        <rect x="0" y="0" width="356" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
        <text x="15" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#6d28d9">«component» 20s Background Health Daemon</text>
        <text x="15" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Continuous Atlas ping; auto-seeds Super Admin</text>
        <text x="15" y="58" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">&amp; courses immediately upon IP whitelisting</text>
      </g>
    </g>
  </g>

  <!-- ==================== NODE 3: CLOUD DATABASE TIER (Right) ==================== -->
  <g transform="translate(1060, 150)" filter="url(#depShadow)">
    <polygon points="0,20 20,0 400,0 380,20" fill="#fde68a" stroke="#d97706" stroke-width="1.5" />
    <polygon points="380,20 400,0 400,680 380,700" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" />
    <rect x="0" y="20" width="380" height="680" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2" />

    <rect x="0" y="20" width="380" height="48" rx="6" fill="#b45309" />
    <text x="190" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff">
      «device» MongoDB Atlas Cloud
    </text>
    <text x="190" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7">
      AWS Mumbai (ap-south-1) M0 Cluster
    </text>

    <!-- Execution Environment: Mongo Engine -->
    <g transform="translate(18, 90)">
      <rect x="0" y="0" width="344" height="580" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4" stroke-width="1.8" />
      <text x="172" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12.5" fill="#0f172a">
        «database system» MongoDB 7.0
      </text>
      <text x="172" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
        ReplicaSet (atlas-aisrrz-shard-0)
      </text>

      <!-- Database: ansariTutorial -->
      <g transform="translate(14, 60)">
        <rect x="0" y="0" width="316" height="420" rx="8" fill="#ffffff" stroke="#cbd5e1" />
        <rect x="0" y="0" width="316" height="34" rx="8" fill="#0b224d" />
        <text x="158" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff">
          «database» ansariTutorial
        </text>

        <!-- Collections -->
        <g transform="translate(15, 50)" font-family="Arial, sans-serif" font-size="11">
          <rect x="0" y="0" width="286" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
          <text x="12" y="20" font-weight="bold" fill="#dc2626">«collection» admins</text>
          <text x="12" y="38" fill="#64748b">Super Admin: admin@ansaritutorial.com</text>

          <rect x="0" y="65" width="286" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
          <text x="12" y="85" font-weight="bold" fill="#2563eb">«collection» courses</text>
          <text x="12" y="103" fill="#64748b">5 Streams: School, Commerce, Sci, Arts, CA</text>

          <rect x="0" y="130" width="286" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
          <text x="12" y="150" font-weight="bold" fill="#d97706">«collection» admissions</text>
          <text x="12" y="168" fill="#64748b">Online Leads &amp; Slow Learner applications</text>

          <rect x="0" y="195" width="286" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
          <text x="12" y="215" font-weight="bold" fill="#7c3aed">«collection» announcements</text>
          <text x="12" y="233" fill="#64748b">Exam schedules, holiday alerts</text>

          <rect x="0" y="260" width="286" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
          <text x="12" y="280" font-weight="bold" fill="#059669">«collection» students</text>
          <text x="12" y="298" fill="#64748b">Registered student portal logins</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== COMMUNICATION PROTOCOL LINKS ==================== -->

  <!-- Client to App Server Communication Link -->
  <g transform="translate(440, 430)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#1d4ed8" stroke-width="3" marker-end="url(#depArrow)" />
    <line x1="100" y1="0" x2="0" y2="0" stroke="#1d4ed8" stroke-width="3" marker-end="url(#depArrow)" />
    <rect x="8" y="-45" width="84" height="38" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="50" y="-28" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="10.5" fill="#1e3a8a">HTTP / HTTPS</text>
    <text x="50" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#2563eb">Port 3000</text>
  </g>

  <!-- App Server to Cloud Atlas Communication Link -->
  <g transform="translate(960, 430)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#059669" stroke-width="3" marker-end="url(#depArrow)" />
    <line x1="100" y1="0" x2="0" y2="0" stroke="#059669" stroke-width="3" marker-end="url(#depArrow)" />
    <rect x="-8" y="-45" width="116" height="38" rx="6" fill="#ecfdf5" stroke="#10b981" />
    <text x="50" y="-28" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="10" fill="#065f46">SRV + TLS 1.3</text>
    <text x="50" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#059669">TCP Port 27017</text>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(40, 930)">
    <rect x="0" y="0" width="1420" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#depShadow)" />
    <text x="25" y="30" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#0b224d">
      DEPLOYMENT SUMMARY:
    </text>
    <text x="180" y="30" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">
      Tier 1: Web Client (Bootstrap 5 Responsive UI) | Tier 2: Application Host (Node.js v24.19 / Express on Port 3000) | Tier 3: Cloud Database (MongoDB Atlas M0 ReplicaSet)
    </text>
    <rect x="1270" y="10" width="130" height="30" rx="15" fill="#dcfce7" stroke="#16a34a" />
    <text x="1335" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#15803d">
      ✓ PRODUCTION
    </text>
  </g>
</svg>
