<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="goldArcDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#e28c07"/>
    </linearGradient>
    <linearGradient id="starGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="ribbonGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#143b6b"/>
    </linearGradient>
  </defs>

  <!-- Circular Arc & Dots -->
  <circle cx="42" cy="40" r="33" stroke="url(#goldArcDark)" stroke-width="4.5" stroke-dasharray="160 45" fill="none" stroke-linecap="round" transform="rotate(-30 42 40)"/>
  <circle cx="14" cy="18" r="1.8" fill="#0c2340"/>
  <circle cx="19" cy="18" r="1.8" fill="#0c2340"/>
  <circle cx="14" cy="23" r="1.8" fill="#0c2340"/>
  <circle cx="19" cy="23" r="1.8" fill="#0c2340"/>

  <!-- Star -->
  <polygon points="65,24 67,29.5 73,29.5 68.2,33 70,38.5 65,35 60,38.5 61.8,33 57,29.5 63,29.5" fill="url(#starGradDark)"/>

  <!-- Cheerful Student Figure Silhouette (Navy for light backgrounds) -->
  <circle cx="40" cy="26" r="4.8" fill="#0c2340"/>
  <polygon points="40,16 54,22 40,28 26,22" fill="#0c2340"/>
  <polygon points="30,24 30,29 40,32 50,29 50,24 40,27" fill="#0c2340"/>
  <path d="M49 23.5 V31" stroke="#f5a623" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="49" cy="32" r="1.3" fill="#f5a623"/>

  <path d="M40 31 C36 33 33 36 31 43 C34 45 37 46 39 42 C42 45 46 49 49 55 C51 56 54 54 53 51 C49 46 45 42 42 37 C45 34 50 31 56 28 C58 27 57 24 55 24 C49 26 44 29 40 31 Z" fill="#0c2340"/>
  <path d="M35 41 C31 46 27 52 24 57 C22 60 25 62 27 60 C31 54 36 47 38 42 Z" fill="#0c2340"/>
  <path d="M42 40 C44 46 46 53 49 59 C50 62 54 61 53 58 C50 52 47 45 44 40 Z" fill="#0c2340"/>

  <!-- ANSARI (Navy) -->
  <text x="90" y="34" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#0c2340" letter-spacing="1.8">ANSARI</text>

  <!-- — TUTORIAL — (Gold) -->
  <line x1="90" y1="43" x2="114" y2="43" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"/>
  <text x="122" y="48" font-family="'Outfit', sans-serif" font-weight="800" font-size="15" fill="#f5a623" letter-spacing="4.5">TUTORIAL</text>
  <line x1="230" y1="43" x2="254" y2="43" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"/>

  <!-- FUN + LEARNING -->
  <g transform="translate(90, 56)">
    <polygon points="0,6 8,0 162,0 170,6 162,18 8,18" fill="url(#ribbonGradDark)"/>
    <text x="85" y="13" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="800" font-size="10.5" fill="#ffffff" letter-spacing="2.5" text-anchor="middle">FUN + LEARNING</text>
  </g>
</svg>
