  </text>
  <rect x="1350" y="42" width="180" height="38" rx="19" fill="#f59e0b" />
  <text x="1440" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#0b224d">
    HIERARCHICAL TREE
  </text>

  <!-- Level 1: Root Project Node -->
  <g transform="translate(560, 130)">
    <rect x="0" y="0" width="480" height="65" rx="14" fill="url(#rootGrad)" filter="url(#shadow2)" />
    <text x="240" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="15" fill="#f59e0b">
      1.0 ANSARI TUTORIAL WEB PLATFORM
