  <path d="M 800 195 L 800 230" fill="none" stroke="#64748b" stroke-width="3" />
  <!-- Horizontal Bus Line -->
  <path d="M 145 230 L 1455 230" fill="none" stroke="#64748b" stroke-width="3" />

  <!-- Vertical drops to 6 Level-2 Nodes -->
  <path d="M 145 230 L 145 260" fill="none" stroke="#64748b" stroke-width="3" />
  <path d="M 407 230 L 407 260" fill="none" stroke="#64748b" stroke-width="3" />
  <path d="M 669 230 L 669 260" fill="none" stroke="#64748b" stroke-width="3" />
  <path d="M 931 230 L 931 260" fill="none" stroke="#64748b" stroke-width="3" />
  <path d="M 1193 230 L 1193 260" fill="none" stroke="#64748b" stroke-width="3" />
  <path d="M 1455 230 L 1455 260" fill="none" stroke="#64748b" stroke-width="3" />

